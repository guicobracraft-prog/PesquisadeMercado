name: Monitoramento de Catálogo e Vendas

on:
  schedule:
    - cron: '0 * * * *'
      timezone: 'America/Sao_Paulo'

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitoramento-catalogo
  cancel-in-progress: false

jobs:
  monitorar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Executar monitoramento
        run: python executar_catalogo.py

      - name: Salvar resultados no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A -f
          git commit -m "Atualização automática do monitoramento [skip ci]" || exit 0
